name: Vertmax
options:
  bundleIdPrefix: com.vertmax.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: 3UYRBBUYH9
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Vertmax:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Vertmax needs camera access to measure your vertical jump from video."
        NSMicrophoneUsageDescription: "Vertmax records short jump clips, which include audio by default."
        NSPhotoLibraryUsageDescription: "Vertmax needs access to your photo library to save and select jump videos."
        NSPhotoLibraryAddUsageDescription: "Vertmax saves your generated jump reels to your photo library."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vertmax
            CFBundleURLName: com.vertmax.ios.auth-callback
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
    entitlements:
      path: Resources/Vertmax.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vertmax.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertmax.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
      - target: VertmaxWidgetExtension
        embed: true

  VertmaxWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension/Sources
      - path: Sources/DesignSystem/Colors.swift
      - path: Sources/DesignSystem/Typography.swift
      - path: Sources/DesignSystem/Spacing.swift
      - path: Sources/DesignSystem/VertmaxLogoMark.swift
      - path: Sources/DesignSystem/TrajectoryArc.swift
      - path: Sources/Shared/WidgetSnapshot.swift
      - path: Resources/Fonts
      - path: WidgetExtension/PrivacyInfo.xcprivacy
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Vertmax Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
    entitlements:
      path: WidgetExtension/VertmaxWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.vertmax.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertmax.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Vertmax Widget
        SKIP_INSTALL: YES
