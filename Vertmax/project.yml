name: Vertmax
options:
  bundleIdPrefix: com.vertmax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: H5A68SDT6C
    CODE_SIGN_STYLE: Automatic

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Vertmax:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Vertmax needs camera access to measure your vertical jump from video."
        NSMicrophoneUsageDescription: "Vertmax records short jump clips, which include audio by default."
        NSPhotoLibraryUsageDescription: "Vertmax needs access to your photo library to save and select jump videos."
        NSPhotoLibraryAddUsageDescription: "Vertmax saves your generated jump reels to your photo library."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vertmax
            CFBundleURLName: com.vertmax.app.auth-callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vertmax.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
